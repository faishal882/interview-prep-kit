# Production composition: API + MongoDB on one host (no telemetry).
# Secrets live in .env on the instance (chmod 600), never in the image.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: trao-api:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      ENV: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: trao
    ports:
      - "80:8000"
    depends_on:
      mongo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:
